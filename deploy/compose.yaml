# Local cluster: 1 Nomad server, 3 Nomad clients (each with its own Docker
# daemon), MySQL, a registry, and an ops box that runs relctl and the tests.
name: relorch

x-node: &node
  build: ./node
  privileged: true
  depends_on: [nomad-server, registry]

services:
  mysql:
    image: mysql:8.4.13
    container_name: relorch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    command: ["--performance-schema=ON", "--max-connections=300"]
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 2s
      retries: 90

  registry:
    image: registry:3.1.2
    container_name: relorch-registry
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes: [registry-data:/var/lib/registry]
    ports: ["127.0.0.1:5050:5000"]

  nomad-server:
    image: hashicorp/nomad:2.1.1
    container_name: relorch-nomad-server
    command: ["agent", "-config=/etc/nomad.d"]
    volumes:
      - ./nomad/server.hcl:/etc/nomad.d/server.hcl:ro
      - nomad-server-data:/nomad/data
    ports: ["127.0.0.1:4646:4646"]

  node1:
    <<: *node
    container_name: relorch-node1
    hostname: node1
    environment: {NODE_NAME: node1}
    volumes: [node1-docker:/var/lib/docker]
  node2:
    <<: *node
    container_name: relorch-node2
    hostname: node2
    environment: {NODE_NAME: node2}
    volumes: [node2-docker:/var/lib/docker]
  node3:
    <<: *node
    container_name: relorch-node3
    hostname: node3
    environment: {NODE_NAME: node3}
    volumes: [node3-docker:/var/lib/docker]

  ops:
    build: ./ops
    container_name: relorch-ops
    depends_on:
      mysql: {condition: service_healthy}
      nomad-server: {condition: service_started}
    working_dir: /work
    volumes:
      - ..:/work
      # Fault injection stops and starts the cluster's own containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NOMAD_ADDR: http://nomad-server:4646
      RELCTL_MYSQL_HOST: mysql
      RELCTL_MYSQL_PASSWORD: relctlpw
      APP_MYSQL_PASSWORD: apppw
      MYSQL_ROOT_PASSWORD: rootpw
      RELCTL_REGISTRY_URL: http://registry:5000
      RELCTL_TRUST_DIR: /work/keys/trusted
      RELCTL_SIGNING_KEY: /work/keys/release.key
      RELCTL_PREFLIGHT_DIR: /work/preflight

volumes:
  mysql-data:
  registry-data:
  nomad-server-data:
  node1-docker:
  node2-docker:
  node3-docker:
